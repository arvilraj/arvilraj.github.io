<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 928" width="800" height="928" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Simplified stays request flow</title>
<desc id="d">A guest request passes a security gate, then one of three services: search, book and hold, or confirm. Each service asks an availability engine, which computes free rooms from bookings, blocked dates and live holds instead of storing a count. The engine reads three stays-only MySQL tables. Razorpay confirms payments through a signed webhook. The admin panel writes to the same tables. Walk-ins, OTA calendars and channel sync are phase 2 feeders into blocked dates.</desc>
